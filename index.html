<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0f0a">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<title>WAVE</title>
<style>
:root{--bg:#0a0f0a;--pn:#111a10;--bd:#2b3c26;--gr:#9fe870;--am:#ffb000;--rd:#ff3b30;--mu:#6f8a63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--gr);font-family:ui-monospace,Menlo,Consolas,Tahoma,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
[hidden]{display:none!important}
#login,#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 0;max-width:480px;margin:auto}
#login{position:fixed;inset:0;height:auto;max-width:none;margin:0;padding:0 24px 8dvh;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 35%,#16261a,#0a0f0a 70%);z-index:5}
.av{width:104px;height:104px;border-radius:50%;border:2px solid var(--bd);background:#0f1a0f center/62% no-repeat url(/icon-192.png)}
#dn{font-size:20px;color:#e6f5d8;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw{display:flex;width:min(290px,84vw)}.pw input{flex:1;border-radius:0 6px 6px 0}.pw button{width:48px;border-radius:6px 0 0 6px;font-size:20px;padding:0}
#lst{text-align:center;min-height:20px;color:var(--mu);font-size:13px}
header{display:flex;align-items:center;gap:8px}
h1{margin:0;color:var(--am);letter-spacing:5px;font-size:20px;flex:1}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--gr);box-shadow:0 0 8px var(--gr)}.dot.off{background:var(--rd)}
select,input[type=text]{padding:10px;border-radius:6px;border:1px solid var(--bd);background:#0a120a;color:var(--gr);font-size:16px;font-family:inherit;min-width:0}
button.s{background:var(--pn);color:var(--gr);border:1px solid var(--bd);border-radius:6px;padding:11px 8px;font-size:14px;font-family:inherit}
button.s.on{border-color:var(--am);color:var(--am)}
#wave{text-align:center;padding:10px;border:1px solid var(--gr);border-radius:6px;font-size:17px}
#wave.busy{border-color:var(--rd);color:var(--rd);box-shadow:0 0 12px #ff3b3055}
.meter{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--mu)}
#vu{display:flex;gap:3px;flex:1;max-width:55%}#vu i{flex:1;height:10px;background:var(--bd);border-radius:1px}
#vu i.on{background:var(--gr)}#vu i.on.h{background:var(--am)}#vu i.on.x{background:var(--rd)}
#users{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--pn)}
#users .talk{color:var(--rd);font-weight:bold}
#pttbox{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#ptt{width:min(64vw,36dvh);height:min(64vw,36dvh);border-radius:50%;border:6px double var(--bd);background:radial-gradient(#1b2a18,#0d140c);color:var(--am);font-size:30px;font-weight:bold;letter-spacing:4px;touch-action:none;font-family:inherit}
#ptt small{display:block;font-size:11px;letter-spacing:0;color:var(--mu)}
#ptt.on{background:radial-gradient(#5a1410,#240807);border-color:var(--rd);color:#fff;box-shadow:0 0 25px var(--rd)}
#pwr{position:absolute;right:0;bottom:0;width:66px;height:34px;font-size:11px;font-family:inherit;border:1px solid var(--am);color:var(--am);border-radius:4px;background:var(--pn)}
#pwr:active{background:var(--am);color:#000}
#tx{text-align:center;height:20px;font-size:14px}
nav{display:flex;gap:8px}nav button{flex:1}
#sheet{position:fixed;inset:0;background:#000b;display:none}#sheet.show{display:flex}
.box{width:100%;max-width:480px;margin:auto auto 0;background:var(--pn);border-top:2px solid var(--bd);padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;font-size:14px}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px}.r input[type=range]{flex:1}.r input[type=text]{flex:1}
#log{height:70px;overflow:hidden;white-space:pre-wrap;font-size:11px;color:var(--mu)}
</style></head><body>
<div id="login">
  <div class="av"></div>
  <div id="dn"></div>
  <div class="pw" id="pwbox"><input id="code" type="password" placeholder="رمز" autocomplete="off"><button class="s" id="join">←</button></div>
  <div id="lst"></div>
</div>
<div id="app" hidden>
  <header><h1>WAVE</h1><select id="chsel"></select><span id="net" class="dot"></span></header>
  <div id="wave">● موج آزاد</div>
  <div class="meter"><span id="freq"></span><div id="vu"></div></div>
  <div id="users"></div>
  <div id="pttbox"><button id="ptt">PTT<small>نگه دار و صحبت کن</small></button><button id="pwr">⏻ POWER</button></div>
  <div id="tx"></div>
  <nav><button class="s" id="sab">🎙 صابر</button><button class="s" id="hp">🎧 هدفون</button><button class="s" id="gear">⚙ تنظیمات</button></nav>
</div>
<div id="sheet"><div class="box">
  <div class="r"><span>صدا</span><input id="vol" type="range" min="0" max="100" value="100"></div>
  <div class="r"><span>خش‌خش</span><input id="hiss" type="range" min="0" max="100" value="20"><button class="s" id="hisstest">تست</button></div>
  <div class="r"><label><input id="radio" type="checkbox"> فیلتر رادیویی</label><label><input id="fx" type="checkbox" checked> بوق‌ها</label><span id="mic"></span></div>
  <div class="r"><label><input id="asr" type="checkbox"> جملهٔ «صابر صابر از میثاق»</label></div>
  <div class="r"><span>صدای PTT</span><select id="snd"></select><button class="s" id="sndtest">پخش</button></div>
  <div class="r"><input id="newch" type="text" placeholder="نام کانال جدید" maxlength="20"><button class="s" id="addch">+ بساز</button></div>
  <div class="r"><button class="s" id="lb">تست تک‌دستگاهی</button><button class="s" id="logout">خروج (تغییر رمز)</button><button class="s" id="close">بستن</button></div>
  <div id="log"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
let myName='',me,token,es,stream,rawTrack,track,talking=false,wantTalk=false,joining=false,pcs={},names={},audios={},chains={},ch='main',curF={holder:null},lb=null;
const cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const log=t=>{const l=$('log');l.textContent=(t+'\n'+l.textContent).split('\n').slice(0,6).join('\n')};
const flash=t=>{$('tx').textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>{if(!talking)$('tx').textContent=''},2200)};
const post=(p,o)=>fetch(p,{method:'POST',body:JSON.stringify({id:me,token,...o})}).then(r=>r.json()).catch(()=>({}));
const store={get(){try{return JSON.parse(localStorage.getItem('wave')||'{}')}catch{return{}}},set(o){try{localStorage.setItem('wave',JSON.stringify(o))}catch{}},clear(){try{localStorage.removeItem('wave')}catch{}}};
const vib=m=>{try{navigator.vibrate&&navigator.vibrate(m)}catch{}};
const AC=new (window.AudioContext||window.webkitAudioContext)();
const rsm=()=>Promise.race([AC.resume().catch(()=>{}),new Promise(r=>setTimeout(r,600))]);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

// ---------- صداهای بی‌سیم ----------
function tone(f,d=.12,v=.12){AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
const beep=(f,d)=>{if($('fx').checked)tone(f,d)};
function click(v=.35){
  if(!$('fx').checked)return; AC.resume();
  const n=AC.sampleRate*.03|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain(); s.buffer=b; g.gain.value=v; s.connect(g); g.connect(AC.destination); s.start();
}
const longBeep=()=>tone(1000,2,.2);
function seq(list,type='square',v=.22){
  AC.resume(); let t=AC.currentTime+.01;
  for(const [f,d] of list){
    if(f){const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.linearRampToValueAtTime(0,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.01)}
    t+=d;
  }
}
function chirp(f0,f1,d,v=.22){
  AC.resume(); const t=AC.currentTime+.01,o=AC.createOscillator(),g=AC.createGain();
  o.type='square'; o.frequency.setValueAtTime(f0,t); o.frequency.linearRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(v,t); g.gain.linearRampToValueAtTime(0,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.01);
}
// بوق اجازهٔ صحبت (Talk Permit) هنگام زدن PTT و بوق پایان هنگام رها کردن؛ سه مدل برای انتخاب
const SND={
  '1':['تک‌بوق کوتاه',()=>seq([[1000,.09]]),()=>seq([[780,.13]])],
  '2':['دوبوق',()=>seq([[1200,.06],[0,.05],[1200,.06]]),()=>seq([[900,.06],[0,.05],[900,.06]])],
  '3':['چیرپ',()=>chirp(800,1700,.13),()=>chirp(1700,800,.13)]
};
const pttOn=()=>{if($('fx').checked)SND[$('snd').value][1]()};
const pttOff=()=>{if($('fx').checked)SND[$('snd').value][2]()};
function powerSound(){ vib([120,60,120,60,350]); seq([[1500,.14],[0,.07],[1500,.14],[0,.07],[1500,.32]],'square',.5) }   // بلند و غیرملودیک
$('snd').innerHTML=Object.entries(SND).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
$('snd').value=store.get().snd||'1';
$('snd').onchange=()=>{store.set({...store.get(),snd:$('snd').value});pttOn();setTimeout(pttOff,600)};
$('sndtest').onclick=()=>{pttOn();setTimeout(pttOff,600)};
const rxOpen=()=>{click();startHiss()};            // شنونده: باز شدن موج
const rxClose=()=>{stopHiss();pttOff()};        // شنونده: راجر بیپ آخر صحبت
function powerOn(n){
  flash('⏻ '+n+': POWER ON'); log(n+': POWER ON'); powerSound();
  setTimeout(()=>{try{const u=new SpeechSynthesisUtterance('Power on');u.lang='en-US';u.volume=1;u.rate=.95;speechSynthesis.speak(u)}catch{}},900);
}
$('pwr').onclick=()=>{vib(30);post('/announce',{})};
const tune=s=>s.replace(/(a=fmtp:\d+ [^\r\n]*useinbandfec=1)/,'$1;stereo=0;maxaveragebitrate=64000;usedtx=0');

// خش‌خش
// خش‌خش: فقط یک پوف کوتاه موقع باز و بسته شدن موج (زیر صدا خش‌خش نیست تا واضح بماند)
function hiss(ms,scale=1){
  const v=$('hiss').value/100; if(!v)return; AC.resume();
  const n=AC.sampleRate*ms/1000|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='bandpass'; f.frequency.value=2400; f.Q.value=.5; g.gain.value=v*.6*scale;
  s.buffer=b; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}
const startHiss=()=>hiss(160,.8),stopHiss=()=>hiss(320,1);
$('hisstest').onclick=()=>hiss(500,1.2);

// فیلتر صدای رادیویی روی صدای دریافتی: باند باریک + کمی اعوجاج + کمپرسور
const anTx=AC.createAnalyser(),anRx=AC.createAnalyser(); anTx.fftSize=anRx.fftSize=512;
function radioChain(src){
  const hp=AC.createBiquadFilter(),lp=AC.createBiquadFilter(),ws=AC.createWaveShaper(),cp=AC.createDynamicsCompressor(),g=AC.createGain();
  hp.type='highpass'; hp.frequency.value=300; lp.type='lowpass'; lp.frequency.value=3400;
  const c=new Float32Array(256); for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(1.2*x)/Math.tanh(1.2)} ws.curve=c;
  cp.threshold.value=-20; cp.ratio.value=3;
  src.connect(hp); hp.connect(lp); lp.connect(ws); ws.connect(cp); cp.connect(g); cp.connect(anRx); g.connect(AC.destination);
  return g;
}
function applyAudio(){
  const radio=$('radio').checked&&AC.state==='running',v=$('vol').value/100;
  rxDirect.gain.value=radio?0:v; rxRadio.gain.value=radio?v*1.3:0;
}
$('vol').oninput=$('radio').onchange=applyAudio; AC.onstatechange=applyAudio;

// ---------- رله صدا از طریق سرور (بدون WebRTC، STUN و TURN) ----------
// فرمت: μ-law، ۱۶ کیلوهرتز، تک‌کاناله؛ فقط دارندهٔ نوبت صحبت می‌تواند بفرستد (سرور بررسی می‌کند)
const MU=f=>{const x=Math.max(-1,Math.min(1,f))*32767|0,s=x<0?0x80:0;let v=Math.min(32635,Math.abs(x))+132,e=7;for(let m=0x4000;!(v&m)&&e>0;e--,m>>=1);return(~(s|(e<<4)|((v>>(e+3))&15)))&255};
const UL=new Float32Array(256);
for(let i=0;i<256;i++){const u=~i&255,t=(((u&15)<<3)+132<<((u>>4)&7))-132;UL[i]=(u&0x80?-t:t)/32768}
const rxBus=AC.createGain(),rxDirect=AC.createGain(),rxRadio=radioChain(rxBus);
rxBus.connect(rxDirect); rxDirect.connect(AC.destination);
let ws=null,tap=null,tapSrc=null,sendUntil=0,upT=null,playT=0;
function playChunk(bytes){
  const n=bytes.length,buf=AC.createBuffer(1,n,16000),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=UL[bytes[i]];
  const s=AC.createBufferSource(); s.buffer=buf; s.connect(rxBus);
  const now=AC.currentTime; if(playT<now+.03)playT=now+.15;     // بافر ۱۵۰ میلی‌ثانیه‌ای
  s.start(playT); playT+=buf.duration;
}
function openWs(){
  const old=ws; ws=null; if(old)try{old.close()}catch{}
  const w=ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?id='+me+'&token='+token);
  w.binaryType='arraybuffer';
  w.onmessage=e=>{if(e.data.byteLength)playChunk(new Uint8Array(e.data))};
  w.onclose=()=>{if(ws===w)setTimeout(()=>{if(ws===w)openWs()},2000)};
  w.onerror=()=>{};
}
setInterval(()=>{if(ws&&ws.readyState===1)ws.send(new ArrayBuffer(0))},25000);   // زنده نگه داشتن اتصال
function ensureTap(){
  try{
    if(tapSrc)tapSrc.disconnect();
    if(!tap){
      tap=AC.createScriptProcessor(2048,1,1); const z=AC.createGain(); z.gain.value=0; tap.connect(z); z.connect(AC.destination);
      tap.onaudioprocess=e=>{
        const sending=talking||Date.now()<sendUntil; if(!lb&&!sending)return;
        const inp=e.inputBuffer.getChannelData(0),r=AC.sampleRate/16000,n=Math.floor(inp.length/r),out=new Uint8Array(n);
        for(let j=0;j<n;j++){const a=Math.floor(j*r),b=Math.max(a+1,Math.floor((j+1)*r));let s=0;for(let k=a;k<b;k++)s+=inp[k];out[j]=MU(s/(b-a))}
        if(lb)playChunk(out); else if(ws&&ws.readyState===1)ws.send(out);
      };
    }
    tapSrc=AC.createMediaStreamSource(new MediaStream([track])); tapSrc.connect(tap);
  }catch(e){log('خطای میکروفون: '+e.message)}
}


// میکروفون: فیلتر بم + کمپرسور + تقویت
async function processMic(raw){
  try{
    await rsm(); if(AC.state!=='running')return raw;
    const src=AC.createMediaStreamSource(new MediaStream([raw])),hp=AC.createBiquadFilter(),cp=AC.createDynamicsCompressor(),g=AC.createGain(),dst=AC.createMediaStreamDestination();
    hp.type='highpass'; hp.frequency.value=120; cp.threshold.value=-24; cp.ratio.value=3; cp.attack.value=.005; cp.release.value=.15; g.gain.value=1.3;
    src.connect(hp); hp.connect(cp); cp.connect(g); g.connect(dst); g.connect(anTx);
    return dst.stream.getAudioTracks()[0];
  }catch{return raw}
}
addEventListener('pointerdown',async()=>{            // اگر بدون لمس وصل شده بودیم، اولین لمس صدا را کامل می‌کند
  await rsm();
  if(track&&track===rawTrack&&AC.state==='running'){
    const t=await processMic(rawTrack);
    if(t!==rawTrack){t.enabled=track.enabled;Object.values(pcs).forEach(pc=>pc.getSenders().forEach(s=>s.track&&s.replaceTrack(t)));track=t;ensureTap()}
  }
},{passive:true});

// نشانگر سطح صدا و فرکانس کانال
$('vu').innerHTML='<i></i>'.repeat(10);
const bars=[...$('vu').children],vb=new Float32Array(512);
const lvl=an=>{an.getFloatTimeDomainData(vb);let s=0;for(const x of vb)s+=x*x;return Math.sqrt(s/512)};
setInterval(()=>{
  let l=0; if(talking)l=lvl(anTx); else if((curF.holder&&curF.holder!==me)||lb)l=lvl(anRx);
  const n=Math.min(10,Math.round(Math.sqrt(l)*14));
  bars.forEach((b,i)=>b.className=i<n?'on'+(i>7?' x':i>5?' h':''):'');
},80);
const freqOf=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return(446.00625+(h%16)*.0125).toFixed(5)};

// ---------- ورود (یک بار؛ بعد از آن خودکار) ----------
async function doJoin(auto){
  if(joining)return; joining=true;
  const fail=m=>{joining=false;$('lst').textContent=m;if(!auto)alert(m)};
  AC.resume();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,sampleRate:48000}})}
  catch(e){return fail('میکروفون در دسترس نیست ('+e.name+'). مجوز میکروفون را بده و ورود را بزن.')}
  $('lst').textContent='در حال اتصال به سرور (بار اول تا ۱ دقیقه)...';
  const r=await fetch('/ice?code='+encodeURIComponent($('code').value)).catch(()=>null);
  if(!r||!r.ok){ if(r&&r.status===403){$('pwbox').hidden=false;return fail('کد دعوت لازم است یا اشتباه است')} return fail('سرور در دسترس نیست') }
  cfg.iceServers=await r.json(); store.set({...store.get(),code:$('code').value});
  setInterval(()=>fetch('/ping').catch(()=>{}),240000);
  rawTrack=stream.getAudioTracks()[0]; track=await processMic(rawTrack); track.enabled=false; ensureTap();
  $('mic').textContent='میکروفون ✅'; setupMedia(); openCh('main'); setInterval(loadChs,15000);
}
$('join').onclick=()=>doJoin(false);
$('logout').onclick=()=>{store.clear();location.reload()};
async function deviceName(){                         // نام دستگاه از خود مرورگر (مدل گوشی)
  let n='';
  const wm=/WaveModel\/(\S+)/.exec(navigator.userAgent); if(wm){try{n=decodeURIComponent(wm[1].replace(/\+/g,' '))}catch{}}
  if(!n)try{const u=navigator.userAgentData; if(u&&u.getHighEntropyValues){n=(await u.getHighEntropyValues(['model'])).model||''}}catch{}
  if(n.length<2){const m=/;\s*([^;)]+?)\s+Build\//.exec(navigator.userAgent); n=m?m[1]:''}
  if(n.length<2){const s=store.get(); const d=s.dev||(10+Math.floor(Math.random()*90)); store.set({...s,dev:d}); n='دستگاه '+d}
  return n.slice(0,24);
}
$('code').onkeydown=e=>{if(e.key==='Enter')doJoin(false)};
(async()=>{
  const s=store.get(); $('code').value=s.code||''; myName=await deviceName(); $('dn').textContent=myName;
  $('lst').textContent=s.code?'در حال اتصال...':'';
  const open=await fetch('/ice').then(r=>r.ok).catch(()=>false);   // اگر سرور رمز نخواهد، کادر رمز پنهان می‌شود
  if(open)$('pwbox').hidden=true;
  if(open||s.code)doJoin(true); else $('lst').textContent='رمز را وارد کن';
})();

// ---------- کانال‌ها ----------
function renderUsers(){
  const rows=[[me,myName],...Object.entries(names)];
  $('users').innerHTML='👥 '+rows.length+' · '+rows.map(([i,n])=>`<span class="${curF.holder===i?'talk':''}">${esc(n)}</span>`).join('، ');
}
function setFloor(f){
  const prev=curF.holder; curF=f; const w=$('wave'); w.classList.toggle('busy',!!f.holder);
  w.textContent=!f.holder?'● موج آزاد':f.holder===me?'🔴 شما در حال ارسال':'🔴 مشغول: '+(f.name||'');
  if(!prev&&f.holder&&f.holder!==me)rxOpen();
  if(prev&&!f.holder&&prev!==me)rxClose();
  renderUsers();
}
function dropPeer(id){
  if(pcs[id])pcs[id].close(); delete pcs[id]; delete names[id];
  if(audios[id])audios[id].remove(); delete audios[id];
  if(chains[id]){try{chains[id].src.disconnect();chains[id].g.disconnect()}catch{}} delete chains[id];
}
function openCh(c){
  if(es)es.close(); Object.keys(pcs).forEach(dropPeer); names={};
  $('freq').textContent='CH '+c+' · '+freqOf(c)+' MHz';
  es=new EventSource('/events?name='+encodeURIComponent(myName)+'&code='+encodeURIComponent($('code').value)+'&ch='+encodeURIComponent(c));
  es.onopen=()=>$('net').className='dot on';
  es.onerror=()=>$('net').className='dot off';
  es.addEventListener('hello',e=>{
    const d=JSON.parse(e.data); me=d.id; token=d.token; if(d.name)myName=d.name; openWs();
    Object.keys(pcs).forEach(dropPeer);
    d.peers.forEach(p=>{names[p.id]=p.name});
    curF={holder:null}; setFloor(d.floor); $('login').hidden=true; $('app').hidden=false; joining=false;
  });
  es.addEventListener('join',e=>{const p=JSON.parse(e.data); names[p.id]=p.name; renderUsers(); log(p.name+' وارد شد')});
  es.addEventListener('leave',e=>{dropPeer(JSON.parse(e.data).id); renderUsers()});
  es.addEventListener('signal',e=>onSignal(JSON.parse(e.data)));
  es.addEventListener('floor',e=>setFloor(JSON.parse(e.data)));
  es.addEventListener('announce',e=>powerOn(JSON.parse(e.data).name));
  es.addEventListener('revoked',()=>{log('زمان صحبت (۶۰ ثانیه) تمام شد');stopTalk()});
  setTimeout(loadChs,800);
}
async function loadChs(){
  if(document.activeElement===$('chsel'))return;
  const r=await fetch('/channels?code='+encodeURIComponent($('code').value)).then(x=>x.json()).catch(()=>[]);
  if(!r.some(c=>c.name===ch))r.push({name:ch,n:1});
  $('chsel').innerHTML=r.map(c=>`<option value="${esc(c.name)}"${c.name===ch?' selected':''}>${esc(c.name)} (${c.n})</option>`).join('');
}
function switchCh(n){
  n=n.trim().replace(/[^\w\u0600-\u06FF-]/g,'').slice(0,20); if(!n||n===ch)return;
  stopTalk(); ch=n; curF={holder:null}; openCh(n);
}
$('chsel').onchange=()=>switchCh($('chsel').value);
$('addch').onclick=()=>{switchCh($('newch').value);$('newch').value='';$('sheet').classList.remove('show')};

// ---------- WebRTC ----------
function connect(id,init){
  const pc=pcs[id]=new RTCPeerConnection(cfg);
  pc.addTrack(track,stream);
  pc.onicecandidate=e=>e.candidate&&post('/signal',{to:id,data:{c:e.candidate}});
  pc.ontrack=e=>{
    const s=e.streams[0]; let a=audios[id];
    if(!a){a=audios[id]=new Audio(); a.autoplay=true; document.body.append(a)}
    a.srcObject=s; a.play().catch(()=>{});
    if(chains[id])try{chains[id].src.disconnect()}catch{}
    const src=AC.createMediaStreamSource(s); chains[id]={src,g:radioChain(src)}; applyAudio();
  };
  pc.onconnectionstatechange=()=>log((names[id]||id)+': '+pc.connectionState);
  if(init)pc.onnegotiationneeded=async()=>{
    const o=await pc.createOffer(); o.sdp=tune(o.sdp); await pc.setLocalDescription(o);
    post('/signal',{to:id,data:{d:pc.localDescription}});
  };
  return pc;
}
function onSignal({from,data}){
  const pc=pcs[from]||connect(from,false);
  pc.q=(pc.q||Promise.resolve()).then(async()=>{
    if(data.d){
      await pc.setRemoteDescription(data.d);
      if(data.d.type==='offer'){const an=await pc.createAnswer(); an.sdp=tune(an.sdp); await pc.setLocalDescription(an); post('/signal',{to:from,data:{d:pc.localDescription}})}
    }
    if(data.c){try{await pc.addIceCandidate(data.c)}catch{}}
  }).catch(e=>log('خطای اتصال: '+e.message));
}

// ---------- PTT ----------
async function startTalk(){
  clearTimeout(upT); wantTalk=true;
  const r=await post('/ptt',{action:'down'});
  if(!wantTalk){if(r.granted)post('/ptt',{action:'up'});return}
  if(!r.granted){wantTalk=false;vib([40,60,40]);tone(200,.25);return flash('موج مشغول است'+(r.holder&&names[r.holder]?': '+names[r.holder]:''))}
  talking=true; track.enabled=true; $('ptt').classList.add('on'); vib(25); click(); pttOn(); $('tx').textContent='🔴 در حال ارسال';
}
function stopTalk(){
  wantTalk=false; if(!talking)return;
  talking=false; sendUntil=Date.now()+250; $('ptt').classList.remove('on'); vib(15); click(.25); pttOff(); $('tx').textContent='';
  upT=setTimeout(()=>{track.enabled=false;post('/ptt',{action:'up'})},260);   // ته جمله بریده نشود
}
const b=$('ptt');
b.onpointerdown=e=>{e.preventDefault(); b.setPointerCapture(e.pointerId); startTalk()};
b.onpointerup=b.onpointercancel=stopTalk;
b.oncontextmenu=e=>e.preventDefault();
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&e.target.tagName!=='INPUT'){e.preventDefault();startTalk()}});
addEventListener('keyup',e=>{if(e.code==='Space')stopTalk()});

// ---------- دکمهٔ هدفون / TWS ----------
let sil=null;
function silentWav(){
  const n=80000,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  const u=new Uint8Array(b,44); for(let i=0;i<n;i++)u[i]=127+(Math.random()*3|0);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function toggleTalk(){ if(sil)sil.play().catch(()=>{}); if(talking||wantTalk)stopTalk(); else startTalk(); }
function setupMedia(){
  sil=new Audio(silentWav()); sil.loop=true; sil.volume=1; sil.play().catch(()=>{});
  if(!('mediaSession' in navigator))return log('دکمهٔ هدفون در این مرورگر پشتیبانی نمی‌شود');
  const ms=navigator.mediaSession;
  ms.metadata=new MediaMetadata({title:'WAVE',artist:'بی‌سیم',artwork:[{src:'/icon-512.png',sizes:'512x512',type:'image/png'}]});
  ms.playbackState='playing';
  ['play','pause','stop','nexttrack','previoustrack','seekforward','seekbackward'].forEach(a=>{try{ms.setActionHandler(a,()=>{flash('🎧 دکمهٔ هدفون: '+a);log('🎧 '+a+' | '+document.visibilityState+' | mic:'+(track&&track.muted?'muted':'live'));toggleTalk();ms.playbackState='playing'})}catch{}});
  setInterval(()=>{try{ms.playbackState='playing'}catch{} if(sil.paused)sil.play().catch(()=>{})},4000);
  document.addEventListener('visibilitychange',()=>{sil.play().catch(()=>{});AC.resume()});
  $('hp').classList.add('on');
}
$('hp').onclick=toggleTalk;
window.waveHeadset=()=>{flash('🎧 دکمهٔ هدفون (اپ)');log('دکمهٔ هدفون (اپ)');toggleTalk()};

// ---------- صابر ----------
let vadT=null,vadSrc=null,lastB=0,rec=null;
function startVad(){
  const an=AC.createAnalyser(); an.fftSize=1024; vadSrc=AC.createMediaStreamSource(stream); vadSrc.connect(an);
  const d=new Float32Array(1024),t0=Date.now(); let amb=.005,loud=0;
  vadT=setInterval(()=>{
    an.getFloatTimeDomainData(d); let s=0; for(const x of d)s+=x*x; const r=Math.sqrt(s/d.length);
    if(Date.now()-t0<1200){amb=Math.max(amb,r);return}
    loud=r>amb*2.5+.012?loud+1:0;
    if(loud>=3&&Date.now()-lastB>4000&&!talking&&!curF.holder){lastB=Date.now();longBeep();log('صدا شناسایی شد 🔔')}
  },60);
}
function saberReply(){log('📻 صابر: صابر به گوشم');const u=new SpeechSynthesisUtterance('صابر به گوشم');u.lang='fa-IR';speechSynthesis.speak(u)}
function startAsr(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR)return log('تشخیص گفتار در این مرورگر نیست');
  rec=new SR(); rec.lang='fa-IR'; rec.continuous=true;
  rec.onresult=e=>{
    const t=e.results[e.results.length-1][0].transcript; log('شنیدم: '+t);
    const n=t.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s/g,'');
    if(/صابر.*صابر.*(میثاق|مثاق|میصاق)/.test(n))setTimeout(saberReply,2300);
  };
  rec.onend=()=>{if(rec)try{rec.start()}catch{}};
  rec.start();
}
$('sab').onclick=()=>{
  if(vadT){clearInterval(vadT);vadT=null;if(vadSrc)vadSrc.disconnect();if(rec){const r=rec;rec=null;r.stop()}$('sab').classList.remove('on');return log('صابر خاموش شد')}
  AC.resume(); startVad(); if($('asr').checked)startAsr(); $('sab').classList.add('on'); log('صابر به‌گوش فعال شد');
};

};
